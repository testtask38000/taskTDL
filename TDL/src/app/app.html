<div class="tdl-container">
  <h1>To Do list</h1>

  <form (ngSubmit)="addTask()">
    <input type="text" name="newTask" [(ngModel)]="newTask" id="">
    <button type="submit">Add</button>
  </form>

  <ul>
    <li *ngFor="let task of tasks">
      <label for="">
        <input type="checkbox" [checked]="task.statusOfCompletion" (change)="complitionTaskStatus(task)" name="" id="">
        <span [class.done]="task.statusOfCompletion">{{ task.text }}</span>
      </label>
      <button type="button" (click)="deleteTask(task.id)">d</button>
    </li>
  </ul>
</div>
